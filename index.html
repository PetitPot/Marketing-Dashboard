<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petit Pot — Instacart Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--orange:#fd5000;--blue:#1b69b3;--green:#43B02A;--g100:#f5f5f5;--g200:#eeeeee;--g300:#e0e0e0;--g500:#9e9e9e;--g700:#616161;--g900:#212121;}
body{font-family:Arial,sans-serif;font-size:14px;background:#f4f4f4;color:var(--g900);}
.hdr{background:var(--blue);color:#fff;padding:11px 20px;display:flex;align-items:center;gap:14px;}
.hdr-logo{width:34px;height:34px;background:var(--orange);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;}
.hdr-title{font-size:17px;font-weight:700;}.hdr-sub{font-size:12px;opacity:.7;margin-top:1px;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.week-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;}
.week-pill select{background:transparent;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;outline:none;max-width:200px;}
.week-pill select option{background:#1b69b3;}
.upload-btn{display:flex;align-items:center;gap:6px;background:var(--orange);border:none;color:#fff;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.upload-btn:hover{opacity:.9;}.upload-btn input{display:none;}
.tab-bar{background:#fff;border-bottom:2px solid var(--g200);display:flex;padding:0 20px;overflow-x:auto;}
.tab{padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--g700);white-space:nowrap;transition:color .15s,border-color .15s;}
.tab:hover{color:var(--blue);}.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.content{padding:18px 20px;}
.kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border:1px solid var(--g300);border-radius:6px;padding:13px 16px;}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--g500);margin-bottom:4px;}
.kpi .val{font-size:22px;font-weight:700;color:var(--g900);}
.kpi .val.ora{color:var(--orange);}.kpi .val.grn{color:#2e7d32;}.kpi .val.blu{color:var(--blue);}
.kpi .sub{font-size:11px;color:var(--g500);margin-top:3px;}
.chg{font-size:11px;margin-top:3px;}.up{color:#2e7d32;}.dn{color:#c62828;}.neu{color:var(--g500);}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
.chart-row.single{grid-template-columns:1fr;}
.chart-card{background:#fff;border:1px solid var(--g300);border-radius:6px;padding:16px;}
.chart-card h3{font-size:13px;font-weight:700;color:var(--g700);margin-bottom:12px;}
.chart-wrap{position:relative;height:210px;}.chart-wrap.tall{height:290px;}.chart-wrap.xtall{height:320px;}.chart-wrap.dyn{position:relative;}
.tbl-card{background:#fff;border:1px solid var(--g300);border-radius:6px;margin-bottom:18px;overflow:hidden;}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--g200);flex-wrap:wrap;gap:8px;}
.tbl-hdr h3{font-size:13px;font-weight:700;color:var(--g700);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:var(--g100);}
th{padding:9px 12px;text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--g500);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;}
th.L{text-align:left;}th.nosort{cursor:default;}th:hover:not(.nosort){color:var(--blue);}
td{padding:9px 12px;text-align:right;border-top:1px solid var(--g200);}td.L{text-align:left;}
tr:hover td{background:#fafafa;}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-weight:700;font-size:12px;}
.rh{background:#e8f5e9;color:#1b5e20;}.rm{background:#fff9c4;color:#827717;}.rl{background:#ffebee;color:#b71c1c;}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
.size-badge{display:inline-block;background:var(--g100);border:1px solid var(--g300);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--g700);margin-left:4px;}
.ntb-bar-wrap{width:100%;background:var(--g200);border-radius:3px;height:5px;margin-top:3px;}
.ntb-bar{height:5px;border-radius:3px;background:var(--green);}
.weeks-loaded{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.wk-badge{background:var(--g100);border:1px solid var(--g300);border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--g700);cursor:pointer;}
.wk-badge.cur{background:var(--blue);color:#fff;border-color:var(--blue);}
.empty-state{padding:40px;text-align:center;color:var(--g500);font-size:13px;}
.notice{background:#fff9e6;border:1px solid #ffe082;border-radius:6px;padding:10px 14px;font-size:12px;color:#6d4c00;margin-bottom:14px;}
.icip-note{background:#e8f4ff;border:1px solid #b3d4f5;border-radius:6px;padding:9px 14px;font-size:12px;color:#0d4a8a;margin-bottom:14px;}
.month-sel{border:1px solid var(--g300);border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--g900);background:#fff;cursor:pointer;}
.section-sep{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--g500);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--g200);}
.yr-2024{color:#9e9e9e;}.yr-2025{color:var(--blue);}.yr-2026{color:var(--orange);}
</style>
</head>

function allWeekKeys(){
  const base=Object.keys(DAILY_WEEKS);
  const extra=Object.keys(extraWeeks);
  return [...new Set([...base,...extra])].sort();
}
function getWeekData(sun){
  if(extraWeeks[sun])return extraWeeks[sun];
  return expandWeek(sun);
}
function currentWeek(){return document.getElementById('weekSel').value;}
function currentWkData(){return getWeekData(currentWeek())||{};}

/* ---- WEEK LABEL ---- */
function fmtWeekLabel(sun){
  const raw=DAILY_WEEKS[sun]||extraWeeks[sun];
  const mon=raw?.s||raw?.weekStart||sun;
  const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pd=s=>{const d=new Date(s+'T12:00:00');return`${MO[d.getMonth()]} ${d.getDate()}`;};
  return`${pd(mon)} – ${pd(sun)}`;
}

/* ---- DAILY CSV PARSING ---- */
function splitLine(line){
  const r=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];if(c==='"')q=!q;else if(c===','&&!q){r.push(cur);cur='';}else cur+=c;}
  r.push(cur);return r;
}
function weekSunday(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const diff=(7-d.getDay())%7; // days until Sunday (0=Sun stays same week)
  const sun=new Date(d); sun.setDate(d.getDate()+(d.getDay()===0?0:diff));
  return sun.toISOString().slice(0,10);
}
function weekMonday(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const diff=d.getDay()===0?-6:1-d.getDay();
  const mon=new Date(d); mon.setDate(d.getDate()+diff);
  return mon.toISOString().slice(0,10);
}

function parseDailyCSV(text){
  const lines=text.trim().split('\n');
  const headers=splitLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,''));
  const idx=h=>headers.indexOf(h);
  const iDate=idx('date'),iStatus=idx('status'),iCamp=idx('campaign'),iAG=idx('ad_group'),
    iProd=idx('product'),iSize=idx('product_size'),
    iSpend=idx('spend'),iSales=idx('attributed_sales'),iUnits=idx('attributed_quantities'),
    iImpr=idx('impressions'),iClicks=idx('clicks'),
    iNtbS=idx('ntb_attributed_sales'),iNtbP=idx('percent_ntb_attributed_sales');

  // Aggregate by week-sun → campaign / product
  const campAgg={}, prodAgg={};
  for(let i=1;i<lines.length;i++){
    const c=splitLine(lines[i]);
    const spend=parseFloat(c[iSpend])||0; if(!spend) continue;
    const date=c[iDate]?.trim(); if(!date) continue;
    const sun=weekSunday(date);
    const mon=weekMonday(date);
    if(!campAgg[sun]) campAgg[sun]={mon};
    if(!prodAgg[sun]) prodAgg[sun]={mon};
    const camp=(c[iCamp]||'').replace(/^Petit Pot /i,'').trim();
    const status=(c[iStatus]||'').trim();
    const ck=camp;
    if(!campAgg[sun][ck]) campAgg[sun][ck]={campaign:camp,status,spend:0,sales:0,units:0,impr:0,clicks:0,ntb_sales:0};
    const cv=campAgg[sun][ck];
    cv.spend+=spend; cv.sales+=parseFloat(c[iSales])||0; cv.units+=parseFloat(c[iUnits])||0;
    cv.impr+=parseInt(c[iImpr])||0; cv.clicks+=parseInt(c[iClicks])||0;
    cv.ntb_sales+=parseFloat(c[iNtbS])||0;
    const prod=(c[iProd]||'').replace(/^Petit Pot /i,'').trim();
    const size=(c[iSize]||'').trim();
    const pk=`${prod}|||${size}`;
    if(!prodAgg[sun][pk]) prodAgg[sun][pk]={product:prod,size,campaign:camp,adGroup:(c[iAG]||'').trim(),status,spend:0,sales:0,units:0,impr:0,clicks:0,ntb_sales:0};
    const pv=prodAgg[sun][pk];
    pv.spend+=spend; pv.sales+=parseFloat(c[iSales])||0; pv.units+=parseFloat(c[iUnits])||0;
    pv.impr+=parseInt(c[iImpr])||0; pv.clicks+=parseInt(c[iClicks])||0;
    pv.ntb_sales+=parseFloat(c[iNtbS])||0;
  }
  // Build result per week
  const result={};
  for(const sun of Object.keys(campAgg)){
    const {mon,...camps}=campAgg[sun];
    const {mon:mon2,...prods}=prodAgg[sun]||{mon};
    result[sun]={weekEnd:sun,weekStart:mon,
      campaigns:Object.values(camps).map(v=>({...v,spend:Math.round(v.spend*100)/100,
        sales:Math.round(v.sales*100)/100,units:Math.round(v.units*100)/100,
        ntb_sales:Math.round(v.ntb_sales*100)/100,ntb_pct:v.sales?v.ntb_sales/v.sales:0})),
      products:Object.values(prods).map(v=>({...v,spend:Math.round(v.spend*100)/100,
        sales:Math.round(v.sales*100)/100,units:Math.round(v.units*100)/100,
        ntb_sales:Math.round(v.ntb_sales*100)/100,ntb_pct:v.sales?v.ntb_sales/v.sales:0}))};
  }
  return result;
}

/* ---- XLSX PARSING (Tracker) ---- */
function parseTrackerXLSX(wb){
  const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
  const MM=m=>{const i=MONTHS.findIndex(x=>m.toLowerCase().trim().startsWith(x.slice(0,3)));return i>=0?String(i+1).padStart(2,'0'):null;};
  const numOf=v=>typeof v==='number'?v:null;
  const ws=wb.Sheets['Summary '];
  if(!ws)throw new Error('Could not find "Summary " sheet.');
  const sumRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  const newSummary={...TRACKER_SUMMARY};
  let curYear=null;
  for(const row of sumRows){
    if(typeof row[1]==='number'&&[2024,2025,2026].includes(row[1])){curYear=row[1];continue;}
    if(curYear&&typeof row[1]==='string'){
      const mm=MM(row[1]);
      if(mm&&numOf(row[4])){
        const key=`${curYear}-${mm}`;
        newSummary[key]={month:key,year:curYear,deliveries:numOf(row[2]),sales:row[4],units:numOf(row[6]),
          sp_spend:numOf(row[11]),attr_units:numOf(row[12]),org_units:numOf(row[13]),arp:numOf(row[14])};
      }
    }
  }
  const wc=wb.Sheets['Campaign '];
  const newCampaigns={...TRACKER_CAMPAIGNS};
  if(wc){
    const cRows=XLSX.utils.sheet_to_json(wc,{header:1,defval:'',raw:true});
    let curCamp=null;
    for(const row of cRows){
      if(row[0]&&typeof row[0]==='string'&&row[0].trim()){curCamp=row[0].trim();if(!newCampaigns[curCamp])newCampaigns[curCamp]={};}
      if(curCamp&&row[1]&&typeof row[1]==='string'){
        const mm=MM(row[1]);
        if(mm&&(numOf(row[2])||numOf(row[4]))){
          newCampaigns[curCamp][mm]={spend:numOf(row[2])||0,sales:numOf(row[4])||0,units:numOf(row[5]),
            impr:numOf(row[6]),clicks:numOf(row[7]),ntb_sales:numOf(row[10]),ntb_pct:numOf(row[11])};
        }
      }
    }
  }
  const wu=wb.Sheets['UPC'];
  const newProds=[];
  if(wu){
    const uRows=XLSX.utils.sheet_to_json(wu,{header:1,defval:'',raw:false,cellDates:true});
    const byKey={};
    for(let i=1;i<uRows.length;i++){
      const row=uRows[i];if(!row[9]||!row[0])continue;
      const wkDate=row[9];
      const wkStr=typeof wkDate==='string'?wkDate.slice(0,10):(wkDate instanceof Date?wkDate.toISOString().slice(0,10):'');
      if(!wkStr||wkStr.slice(0,4)<'2025')continue;
      const ym=wkStr.slice(0,7);
      const key=`${ym}|${row[0]}|${row[2]}`;
      if(!byKey[key])byKey[key]={month:ym,product:String(row[1]||''),size:String(row[2]||''),sales:0,units:0,deliveries:0};
      byKey[key].sales+=parseFloat(row[11])||0;byKey[key].units+=parseFloat(row[12])||0;byKey[key].deliveries+=parseFloat(row[10])||0;
    }
    for(const v of Object.values(byKey)){if(v.sales>1){v.sales=Math.round(v.sales*100)/100;newProds.push(v);}}
  }
  return{summary:newSummary,campaigns:newCampaigns,products:newProds.length?newProds:TRACKER_PRODUCTS};
}

/* ---- UPLOAD HANDLER ---- */
function handleUpload(input){
  const file=input.files[0];if(!file)return;
  const isXLSX=file.name.toLowerCase().endsWith('.xlsx');
  if(isXLSX){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
        if(wb.Sheets['Summary ']){
          const parsed=parseTrackerXLSX(wb);
          trackerSummary=parsed.summary;trackerCampaigns=parsed.campaigns;trackerProducts=parsed.products;
          alert(`Tracker loaded: ${Object.keys(parsed.summary).length} months.`);
          setTabByName('icip');
        }else{alert('Unrecognized XLSX. Expected Monthly Instacart Tracker with "Summary " sheet.');}
      }catch(err){alert('Could not parse XLSX: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
  }else{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const text=e.target.result;
        const firstLine=text.split('\n')[0];
        if(firstLine.includes(',date,')||firstLine.startsWith('date,')){
          // Daily raw CSV
          const parsed=parseDailyCSV(text);
          const weeks=Object.keys(parsed);
          weeks.forEach(sun=>{extraWeeks[sun]=parsed[sun];});
          populateWeekSelector();
          const latest=Object.keys(parsed).sort().pop();
          document.getElementById('weekSel').value=latest;
          alert(`Loaded ${weeks.length} Mon–Sun weeks from daily data.`);
          if(activeTab==='icip')setTabByName('summary');else render();
        }else{
          alert('Unrecognized CSV format. Expected daily allproduct_raw CSV with a "date" column.');
        }
      }catch(err){alert('Could not parse file: '+err.message);}
    };
    reader.readAsText(file);
  }
  input.value='';
}

}

    if(prodSortKey==='ctr'){av=a.impr?a.clicks/a.impr:0;bv=b.impr?b.clicks/b.impr:0;}

  $('content').innerHTML=`${weekBadges()}

  </div>
  <div class="chart-row single"><div class="chart-card"><h3>Total Sales by Product (ICIP) — ${moLabel}</h3><div class="chart-wrap dyn" style="height:${Math.max(320,icipItems.length*32)}px"><canvas id="cv-icip-prod"></canvas></div></div></div>
  <div class="chart-row single"><div class="chart-card"><h3>Ad Attributed Sales by Product — ${fmtWeekLabel(currentWeek())}</h3><div class="chart-wrap tall"><canvas id="cv-prod-chart"></canvas></div></div></div>
  <div class="tbl-card"><div class="tbl-hdr"><h3>Products — ${fmtWeekLabel(currentWeek())}</h3></div><div class="tbl-wrap"><table><thead><tr>${H('Product','product',true)}<th class="L nosort">Format</th><th class="L nosort">Campaign</th><th class="nosort">Total Sales (${moLabel.split(' ')[0]})</th>${H('Spend','spend')}${H('Ad Attributed Sales','sales')}${H('ROAS','roas')}${H('Units','units')}${H('Impressions','impr')}${H('Clicks','clicks')}${H('CTR','ctr')}${H('NTB Sales','ntb_sales')}<th class="nosort">NTB%</th></tr></thead><tbody>${rows.map(r=>{const roas=r.spend?r.sales/r.spend:0;const dn=displayProd(r.product,r.size);const fmt=prodFormat(r.product,r.size);const fmtClr=FORMAT_COLORS[fmt]||'#9e9e9e';const icipSales=icipByProd[dn]||0;return`<tr><td class="L" style="font-weight:700">${dn}</td><td class="L"><span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:${fmtClr}18;color:${fmtClr};border:1px solid ${fmtClr}44">${fmt}</span></td><td class="L" style="color:var(--g700);font-size:12px">${r.campaign}</td><td style="font-weight:600">${icipSales?fmtD(icipSales):'—'}</td><td>${fmtD(r.spend)}</td><td>${fmtD(r.sales)}</td><td><span class="pill ${rCls(roas)}">${fmtR(roas)}</span></td><td>${Math.round(r.units).toLocaleString()}</td><td>${fmtK(r.impr)}</td><td>${fmtK(r.clicks)}</td><td>${r.impr?fmtP(r.clicks/r.impr):'-'}</td><td>${r.ntb_sales>0?fmtD(r.ntb_sales):'-'}</td><td>${r.ntb_pct>0?`${(r.ntb_pct*100).toFixed(1)}%<div class="ntb-bar-wrap"><div class="ntb-bar" style="width:${Math.min(r.ntb_pct*100,100)}%"></div></div>`:'-'}</td></tr>`;}).join('')}</tbody></table></div></div>`;

/* ============================================================  TREND  ============================================================ */
function renderTrend(){
  const allWks=allWeekKeys().filter(w=>{const d=getWeekData(w);return d?.campaigns?.length>0;});
  if(allWks.length<2){$('content').innerHTML=`<div class="empty-state">Need at least 2 weeks of data.</div>`;return;}
  // Init range to last 13 weeks if not set
  if(!trendFrom||!allWks.includes(trendFrom))trendFrom=allWks[Math.max(0,allWks.length-13)];
  if(!trendTo||!allWks.includes(trendTo))trendTo=allWks[allWks.length-1];
  if(trendFrom>trendTo)trendFrom=trendTo;
  const weeks=allWks.filter(w=>w>=trendFrom&&w<=trendTo);
  const wkT=weeks.map(w=>{const d=getWeekData(w);const active=(d.campaigns||[]).filter(c=>c.spend>0);return{wk:w,lbl:fmtWeekLabel(w),...totals(active)};});
  const labels=wkT.map(t=>t.lbl);
  const presets=[{label:'4W',n:4},{label:'8W',n:8},{label:'13W',n:13},{label:'26W',n:26},{label:'All',n:allWks.length}];
  const selN=allWks.indexOf(trendTo)-allWks.indexOf(trendFrom)+1;
  const rangeBar=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid var(--g300);border-radius:6px;padding:10px 14px;">
    <span style="font-size:12px;font-weight:700;color:var(--g700);">Range:</span>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      ${presets.map(p=>{const active=selN===p.n&&allWks.indexOf(trendTo)===allWks.length-1;return`<button onclick="setTrendPreset(${p.n})" style="padding:4px 12px;border-radius:12px;border:1px solid ${active?'var(--orange)':'var(--g300)'};background:${active?'var(--orange)':'#fff'};color:${active?'#fff':'var(--g700)'};font-size:12px;font-weight:600;cursor:pointer;">${p.label}</button>`;}).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;">
      <label style="font-size:12px;color:var(--g700);font-weight:600;">From</label>
      <select class="month-sel" onchange="trendFrom=this.value;renderTrend()">
        ${allWks.map(w=>`<option value="${w}" ${w===trendFrom?'selected':''}>${fmtWeekLabel(w)}</option>`).join('')}
      </select>
      <label style="font-size:12px;color:var(--g700);font-weight:600;">To</label>
      <select class="month-sel" onchange="trendTo=this.value;renderTrend()">
        ${allWks.map(w=>`<option value="${w}" ${w===trendTo?'selected':''}>${fmtWeekLabel(w)}</option>`).join('')}
      </select>
      <span style="font-size:11px;color:var(--g500)">${weeks.length} weeks</span>
    </div>
  </div>`;
  $('content').innerHTML=`${rangeBar}
    <div class="chart-row single"><div class="chart-card"><h3>Blended ROAS — Weekly (Mon–Sun)</h3><div class="chart-wrap tall"><canvas id="cv-t-roas"></canvas></div></div></div>
    <div class="chart-row">
      <div class="chart-card"><h3>Spend vs. Sales — Weekly</h3><div class="chart-wrap"><canvas id="cv-t-ss"></canvas></div></div>
      <div class="chart-card"><h3>NTB vs. Repeat Sales — Weekly</h3><div class="chart-wrap"><canvas id="cv-t-ntb"></canvas></div></div>
    </div>
    <div class="tbl-card"><div class="tbl-hdr"><h3>Week-by-Week Summary (Mon–Sun)</h3></div><div class="tbl-wrap"><table><thead><tr><th class="L">Week</th><th>Spend</th><th>Sales</th><th>ROAS</th><th>Units</th><th>Impr</th><th>Clicks</th><th>CTR</th><th>CPC</th><th>NTB Sales</th><th>NTB%</th></tr></thead><tbody>${[...wkT].reverse().map(t=>`<tr><td class="L" style="font-weight:600">${t.lbl}</td><td>${fmt$(t.spend)}</td><td>${fmt$(t.sales)}</td><td><span class="pill ${rCls(t.roas)}">${fmtR(t.roas)}</span></td><td>${Math.round(t.units).toLocaleString()}</td><td>${fmtK(t.impr)}</td><td>${fmtK(t.clicks)}</td><td>${fmtP(t.ctr)}</td><td>${fmtC(t.cpc)}</td><td>${fmt$(t.ntb)}</td><td>${fmtP(t.ntb_pct)}</td></tr>`).join('')}</tbody></table></div></div>`;
  setTimeout(()=>{
    chartRefs.tRoas=new Chart($('cv-t-roas'),{type:'line',data:{labels,datasets:[{label:'ROAS',data:wkT.map(t=>+t.roas.toFixed(2)),borderColor:'#fd5000',backgroundColor:'#fd500020',fill:true,tension:0.4,pointRadius:4},{label:'4x',data:labels.map(()=>4),borderColor:'#bbb',borderDash:[6,3],borderWidth:1.5,pointRadius:0,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{beginAtZero:false,ticks:{callback:v=>v+'x'},grid:{color:'#f0f0f0'}}}}});

    chartRefs.tNTB=new Chart($('cv-t-ntb'),{type:'bar',data:{labels,datasets:[{label:'NTB',data:wkT.map(t=>t.ntb),backgroundColor:'#43B02A55',borderColor:'#43B02A',borderWidth:2,borderRadius:3},{label:'Repeat',data:wkT.map(t=>t.sales-t.ntb),backgroundColor:'#1b69b322',borderColor:'#1b69b3',borderWidth:2,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:'#f0f0f0'}}}}});
  },50);
}

    </div>
    ${sortedProds.length?`<div class="chart-row single"><div class="chart-card"><h3>Total Sales by Product — ${icipProdMonth}</h3><div class="chart-wrap xtall"><canvas id="cv-ic-prod"></canvas></div></div></div>
    <div class="tbl-card"><div class="tbl-hdr"><h3>Product Sales — ${icipProdMonth}</h3></div><div class="tbl-wrap"><table><thead><tr>${HP('Product','sales',true)}<th class="L nosort">Size</th>${HP('Total Sales','sales')}${HP('Units','units')}${HP('Deliveries','deliveries')}${HP('ARP','arp')}<th class="nosort">Share</th></tr></thead><tbody>${(()=>{const PCOLS=['#fd5000','#1b69b3','#43B02A','#FF9900','#9c27b0','#00838f','#e53935','#546e7a','#f57c00','#388e3c','#7b1fa2','#0288d1'];return sortedProds.map((p,i)=>{const arpVal=p.units?p.sales/p.units:0;const pct=grandTot?p.sales/grandTot:0;return`<tr><td class="L" style="font-weight:600">${displayProd(p.product, p.size)}</td><td class="L"><span class="size-badge">${p.size}</span></td><td style="font-weight:600">${fmt$(p.sales)}</td><td>${Math.round(p.units).toLocaleString()}</td><td>${Math.round(p.deliveries).toLocaleString()}</td><td>${arpVal?'$'+arpVal.toFixed(2):'-'}</td><td><div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><span style="font-size:12px;color:var(--g700);min-width:34px">${(pct*100).toFixed(1)}%</span><div style="width:70px;background:var(--g200);border-radius:3px;height:6px"><div style="width:${Math.min(pct*100,100)}%;height:6px;border-radius:3px;background:${PCOLS[i%PCOLS.length]}"></div></div></div></td></tr>`;}).join('');})()}</tbody></table></div></div>`:'<div class="notice">No product data for this month.</div>'}`;

  const mo26=allMonths.map(mm=>byYr['2026']?.[mm]?.sales||null);
  const mo25=allMonths.map(mm=>byYr['2025']?.[mm]?.sales||null);
  const mo24=allMonths.map(mm=>byYr['2024']?.[mm]?.sales||null);
  const spendMo=months2026.map(mm=>byYr['2026'][mm]?.spend||0);
  const salesMo=months2026.map(mm=>byYr['2026'][mm]?.sales||0);
  const attrMo=months2026.map(mm=>byYr['2026'][mm]?.attr_units||0);
  const orgMo=months2026.map(mm=>byYr['2026'][mm]?.org_units||0);
  const moLabels26=months2026.map(mm=>MO_NAMES[parseInt(mm)-1]);
  const topProds=sortedProds.slice(0,12);
  const PCOLS=['#fd5000','#1b69b3','#43B02A','#FF9900','#9c27b0','#00838f','#e53935','#546e7a','#f57c00','#388e3c','#7b1fa2','#0288d1'];

  setTimeout(()=>{
    chartRefs.icTrend=new Chart($('cv-ic-trend'),{type:'bar',data:{labels:MO_NAMES,datasets:[
      {label:'2024',data:mo24,backgroundColor:'#9e9e9e33',borderColor:'#9e9e9e',borderWidth:2,borderRadius:3},
      {label:'2025',data:mo25,backgroundColor:'#1b69b333',borderColor:'#1b69b3',borderWidth:2,borderRadius:3},
      {label:'2026',data:mo26,backgroundColor:'#fd500055',borderColor:'#fd5000',borderWidth:2,borderRadius:3},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+Math.round(v/1000)+'K'},grid:{color:'#f0f0f0'}}}}});
    chartRefs.icSpend=new Chart($('cv-ic-spend'),{type:'bar',data:{labels:moLabels26,datasets:[
      {label:'Total Sales',data:salesMo,backgroundColor:'#fd500033',borderColor:'#fd5000',borderWidth:2,borderRadius:3},
      {label:'Ad Spend',data:spendMo,backgroundColor:'#1b69b355',borderColor:'#1b69b3',borderWidth:2,borderRadius:3},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+Math.round(v/1000)+'K'},grid:{color:'#f0f0f0'}}}}});
    chartRefs.icUnits=new Chart($('cv-ic-units'),{type:'bar',data:{labels:moLabels26,datasets:[
      {label:'Attributed',data:attrMo,backgroundColor:'#fd500055',borderColor:'#fd5000',borderWidth:2,borderRadius:3},
      {label:'Organic',data:orgMo,backgroundColor:'#43B02A44',borderColor:'#43B02A',borderWidth:2,borderRadius:3},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,grid:{color:'#f0f0f0'}}}}});
    CAMP_NAMES.forEach((cn,ci)=>{
      const el=$(`cv-camp-${ci}`);if(!el)return;
      const campData=trackerCampaigns[cn]||{};
      const cMonths=Object.keys(campData).sort();
      chartRefs[`camp${ci}`]=new Chart(el,{type:'bar',data:{labels:cMonths.map(mm=>MO_NAMES[parseInt(mm)-1]),datasets:[
        {label:'Attributed Sales',data:cMonths.map(mm=>campData[mm]?.sales||0),backgroundColor:ci===0?'#1b69b333':'#fd500033',borderColor:ci===0?'#1b69b3':'#fd5000',borderWidth:2,borderRadius:3},
        {label:'Spend',data:cMonths.map(mm=>campData[mm]?.spend||0),backgroundColor:'#43B02A33',borderColor:'#43B02A',borderWidth:2,borderRadius:3},
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+Math.round(v/1000)+'K'},grid:{color:'#f0f0f0'}}}}});
    });
    if($('cv-ic-prod')&&topProds.length){
      chartRefs.icProd=new Chart($('cv-ic-prod'),{type:'bar',data:{
        labels:topProds.map(p=>displayProd(p.product,p.size)),
        datasets:[{label:'Total Sales',data:topProds.map(p=>p.sales),backgroundColor:PCOLS.map(c=>c+'80'),borderColor:PCOLS,borderWidth:2,borderRadius:4}]
      },options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:'#f0f0f0'}}}}});
    }
  },50);
}
function sortICIP(key){if(icipSortKey===key)icipSortDir*=-1;else{icipSortKey=key;icipSortDir=-1;}renderICIP();}
function setTrendPreset(n){const allWks=allWeekKeys().filter(w=>{const d=getWeekData(w);return d?.campaigns?.length>0;});trendTo=allWks[allWks.length-1];trendFrom=allWks[Math.max(0,allWks.length-n)];renderTrend();}

/* ---- INIT ---- */
populateWeekSelector();
document.getElementById('weekPillWrap').style.display='';
render();
</script>
</body>
