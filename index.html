<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--orange:#fd5000;--blue:#1b69b3;--green:#43B02A;--g100:#f5f5f5;--g200:#eeeeee;--g300:#e0e0e0;--g500:#9e9e9e;--g700:#616161;--g900:#212121;}
body{font-family:Arial,sans-serif;font-size:14px;background:#f4f4f4;color:var(--g900);}
.hdr{background:var(--blue);color:#fff;padding:11px 20px;display:flex;align-items:center;gap:14px;}
.hdr-logo{width:34px;height:34px;background:var(--orange);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;}
.hdr-title{font-size:17px;font-weight:700;}.hdr-sub{font-size:12px;opacity:.7;margin-top:1px;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.week-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;}
.week-pill select{background:transparent;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;outline:none;}
.week-pill select option{background:#1b69b3;}
.upload-btn{display:flex;align-items:center;gap:6px;background:var(--orange);border:none;color:#fff;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.upload-btn:hover{opacity:.9;}.upload-btn input{display:none;}
.tab-bar{background:#fff;border-bottom:2px solid var(--g200);display:flex;padding:0 20px;overflow-x:auto;}
.tab{padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--g700);white-space:nowrap;transition:color .15s,border-color .15s;}
.tab:hover{color:var(--blue);}.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.content{padding:18px 20px;}
.kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px;}
.kpi-strip-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border:1px solid var(--g300);border-radius:6px;padding:13px 16px;}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--g500);margin-bottom:4px;}
.kpi .val{font-size:22px;font-weight:700;color:var(--g900);}
.kpi .val.ora{color:var(--orange);}.kpi .val.grn{color:#2e7d32;}.kpi .val.blu{color:var(--blue);}
.kpi .sub{font-size:11px;color:var(--g500);margin-top:3px;}
.chg{font-size:11px;margin-top:3px;}.up{color:#2e7d32;}.dn{color:#c62828;}.neu{color:var(--g500);}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
.chart-row.single{grid-template-columns:1fr;}.chart-row.thirds{grid-template-columns:2fr 1fr;}
.chart-card{background:#fff;border:1px solid var(--g300);border-radius:6px;padding:16px;}
.chart-card h3{font-size:13px;font-weight:700;color:var(--g700);margin-bottom:12px;}
.chart-wrap{position:relative;height:210px;}.chart-wrap.tall{height:290px;}.chart-wrap.xtall{height:320px;}
.tbl-card{background:#fff;border:1px solid var(--g300);border-radius:6px;margin-bottom:18px;overflow:hidden;}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--g200);flex-wrap:wrap;gap:8px;}
.tbl-hdr h3{font-size:13px;font-weight:700;color:var(--g700);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:var(--g100);}
th{padding:9px 12px;text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--g500);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;}
th.L{text-align:left;}th.nosort{cursor:default;}th:hover:not(.nosort){color:var(--blue);}
td{padding:9px 12px;text-align:right;border-top:1px solid var(--g200);}td.L{text-align:left;}
tr:hover td{background:#fafafa;}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-weight:700;font-size:12px;}
.rh{background:#e8f5e9;color:#1b5e20;}.rm{background:#fff9c4;color:#827717;}.rl{background:#ffebee;color:#b71c1c;}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
.size-badge{display:inline-block;background:var(--g100);border:1px solid var(--g300);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--g700);margin-left:4px;}
.ntb-bar-wrap{width:100%;background:var(--g200);border-radius:3px;height:5px;margin-top:3px;}
.ntb-bar{height:5px;border-radius:3px;background:var(--green);}
.weeks-loaded{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.wk-badge{background:var(--g100);border:1px solid var(--g300);border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--g700);cursor:pointer;}
.wk-badge.cur{background:var(--blue);color:#fff;border-color:var(--blue);}
.empty-state{padding:40px;text-align:center;color:var(--g500);font-size:13px;}
.notice{background:#fff9e6;border:1px solid #ffe082;border-radius:6px;padding:10px 14px;font-size:12px;color:#6d4c00;margin-bottom:14px;}
.icip-note{background:#e8f4ff;border:1px solid #b3d4f5;border-radius:6px;padding:9px 14px;font-size:12px;color:#0d4a8a;margin-bottom:14px;}
.month-sel{border:1px solid var(--g300);border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--g900);background:#fff;cursor:pointer;}
.section-sep{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--g500);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--g200);}
.yr-2024{color:#9e9e9e;}.yr-2025{color:var(--blue);}.yr-2026{color:var(--orange);}
</style>
</head>

/* ---- CSV PARSING ---- */
function splitLine(line){
  const r=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];if(c==='"')q=!q;else if(c===','&&!q){r.push(cur);cur='';}else cur+=c;}
  r.push(cur);return r;
}
function extractWeekEnd(filename){
  const m=filename.match(/(\d{8})-(\d{8})/);
  if(m){const d=m[2];return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;}
  return new Date().toISOString().slice(0,10);
}
function parseCSV(text,filename){
  const lines=text.trim().split('\n');
  const headers=splitLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,''));
  const weekEnd=extractWeekEnd(filename);
  const isProduct=headers.includes('product');
  const idx=h=>headers.indexOf(h);
  if(isProduct){
    const iStatus=idx('status'),iCampaign=idx('campaign'),iAdGroup=idx('ad_group'),
      iProduct=idx('product'),iSize=idx('product_size'),
      iSpend=idx('spend'),iSales=idx('attributed_sales'),iUnits=idx('attributed_quantities'),
      iImpr=idx('impressions'),iClicks=idx('clicks'),
      iNtbS=idx('ntb_attributed_sales'),iNtbP=idx('percent_ntb_attributed_sales');
    const products=[];
    for(let i=1;i<lines.length;i++){
      const c=splitLine(lines[i]);const spend=parseFloat(c[iSpend])||0;if(!spend)continue;
      products.push({product:(c[iProduct]||'').replace(/^Petit Pot /i,'').replace(/,.*$/,'').trim(),
        size:(c[iSize]||'').trim(),campaign:(c[iCampaign]||'').replace(/^"|"$/g,'').trim(),
        adGroup:(c[iAdGroup]||'').trim(),status:(c[iStatus]||'').toLowerCase(),
        spend,sales:parseFloat(c[iSales])||0,units:parseFloat(c[iUnits])||0,
        impr:parseInt(c[iImpr])||0,clicks:parseInt(c[iClicks])||0,
        ntb_sales:parseFloat(c[iNtbS])||0,ntb_pct:parseFloat(c[iNtbP])/100||0});
    }
    return{weekEnd,type:'products',data:products};
  }else{
    const iStatus=idx('status'),iCamp=idx('campaign'),
      iSpend=idx('spend'),iSales=idx('attributed_sales'),iUnits=idx('attributed_quantities'),
      iImpr=idx('impressions'),iClicks=idx('clicks'),
      iNtbS=idx('ntb_attributed_sales'),iNtbP=idx('percent_ntb_attributed_sales');
    if(iSpend<0||iSales<0)throw new Error('Unrecognized CSV format.');
    const campaigns=[];
    for(let i=1;i<lines.length;i++){
      const c=splitLine(lines[i]);const spend=parseFloat(c[iSpend])||0;if(!spend)continue;
      campaigns.push({campaign:(c[iCamp]||'').replace(/^"|"$/g,'').trim(),
        status:(c[iStatus]||'').toLowerCase(),
        spend,sales:parseFloat(c[iSales])||0,units:parseFloat(c[iUnits])||0,
        impr:parseInt(c[iImpr])||0,clicks:parseInt(c[iClicks])||0,
        ntb_sales:parseFloat(c[iNtbS])||0,ntb_pct:parseFloat(c[iNtbP])/100||0});
    }
    return{weekEnd,type:'campaigns',data:campaigns};
  }
}

/* ---- XLSX PARSING (Tracker file) ---- */
function parseTrackerXLSX(wb){
  const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
  const MM=m=>{const i=MONTHS.findIndex(x=>m.toLowerCase().trim().startsWith(x.slice(0,3)));return i>=0?String(i+1).padStart(2,'0'):null;};
  const numOf=v=>typeof v==='number'?v:null;

  // Summary sheet
  const ws=wb.Sheets['Summary '];
  if(!ws)throw new Error('Could not find "Summary " sheet in this file.');
  const sumRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  const newSummary={...TRACKER_SUMMARY};
  let curYear=null;
  for(const row of sumRows){
    if(typeof row[1]==='number'&&[2024,2025,2026].includes(row[1])){curYear=row[1];continue;}
    if(curYear&&typeof row[1]==='string'){
      const mm=MM(row[1]);
      if(mm&&numOf(row[4])){
        const key=`${curYear}-${mm}`;
        newSummary[key]={month:key,year:curYear,
          deliveries:numOf(row[2]),sales:row[4],units:numOf(row[6]),
          sp_spend:numOf(row[11]),attr_units:numOf(row[12]),org_units:numOf(row[13]),arp:numOf(row[14])};
      }
    }
  }

  // Campaign sheet
  const wc=wb.Sheets['Campaign '];
  const newCampaigns={...TRACKER_CAMPAIGNS};
  if(wc){
    const cRows=XLSX.utils.sheet_to_json(wc,{header:1,defval:'',raw:true});
    let curCamp=null;
    for(const row of cRows){
      if(row[0]&&typeof row[0]==='string'&&row[0].trim()!==''){curCamp=row[0].trim().replace(/\s+$/,'');if(!newCampaigns[curCamp])newCampaigns[curCamp]={};}
      if(curCamp&&row[1]&&typeof row[1]==='string'){
        const mm=MM(row[1]);
        if(mm&&(numOf(row[2])||numOf(row[4]))){
          newCampaigns[curCamp][mm]={spend:numOf(row[2])||0,sales:numOf(row[4])||0,
            units:numOf(row[5]),impr:numOf(row[6]),clicks:numOf(row[7]),
            ntb_sales:numOf(row[10]),ntb_pct:numOf(row[11])};
        }
      }
    }
  }

  // UPC sheet
  const wu=wb.Sheets['UPC'];
  const newProds=[];
  if(wu){
    const uRows=XLSX.utils.sheet_to_json(wu,{header:1,defval:'',raw:false,cellDates:true});
    const byKey={};
    for(let i=1;i<uRows.length;i++){
      const row=uRows[i];
      if(!row[9]||!row[0])continue;
      const wkDate=row[9];
      if(!wkDate)continue;
      const wkStr=typeof wkDate==='string'?wkDate.slice(0,10):(wkDate instanceof Date?wkDate.toISOString().slice(0,10):'');
      if(!wkStr||wkStr.slice(0,4)<'2025')continue;
      const ym=wkStr.slice(0,7);
      const key=`${ym}|${row[0]}|${row[2]}`;
      if(!byKey[key])byKey[key]={month:ym,product:String(row[1]||''),size:String(row[2]||''),sales:0,units:0,deliveries:0};
      byKey[key].sales+=parseFloat(row[11])||0;
      byKey[key].units+=parseFloat(row[12])||0;
      byKey[key].deliveries+=parseFloat(row[10])||0;
    }
    for(const v of Object.values(byKey)){if(v.sales>1){v.sales=Math.round(v.sales*100)/100;newProds.push(v);}}
  }

  return{summary:newSummary,campaigns:newCampaigns,products:newProds.length?newProds:TRACKER_PRODUCTS};
}

let trackerSummary=TRACKER_SUMMARY;
let trackerCampaigns=TRACKER_CAMPAIGNS;
let trackerProducts=TRACKER_PRODUCTS;

function handleUpload(input){
  const file=input.files[0];if(!file)return;
  const isXLSX=file.name.toLowerCase().endsWith('.xlsx');
  if(isXLSX){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
        const hasSum=wb.SheetNames.some(s=>s.trim()==='Summary');
        if(wb.Sheets['Summary ']||hasSum){
          const parsed=parseTrackerXLSX(wb);
          trackerSummary=parsed.summary;trackerCampaigns=parsed.campaigns;trackerProducts=parsed.products;
          alert(`Tracker loaded: ${Object.keys(parsed.summary).length} months, ${parsed.products.length} product records.`);
          if(activeTab!=='icip')setTabByName('icip');else renderICIP();
        } else {
          alert('Unrecognized XLSX. Expected Monthly Instacart Tracker with "Summary " sheet.');
        }
      }catch(err){alert('Could not parse XLSX: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
  }else{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const result=parseCSV(e.target.result,file.name);
        if(!weekData[result.weekEnd])weekData[result.weekEnd]={};
        if(result.type==='campaigns')weekData[result.weekEnd].campaigns=result.data;
        else weekData[result.weekEnd].products=result.data;
        saveStorage();populateWeekSelector();
        document.getElementById('weekSel').value=result.weekEnd;
        if(activeTab==='icip')setTabByName('summary');else render();
      }catch(err){alert('Could not parse CSV: '+err.message);}
    };
    reader.readAsText(file);
  }
  input.value='';
}
function setTabByName(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));render();}

/* ---- WEEK SELECTOR ---- */
function populateWeekSelector(){
  const sel=document.getElementById('weekSel');const cur=sel.value;
  const weeks=Object.keys(weekData).sort().reverse();
  sel.innerHTML=weeks.map(w=>`<option value="${w}">${w}</option>`).join('');
  sel.value=cur&&weekData[cur]?cur:(weeks[0]||'');
}
function currentWeek(){return document.getElementById('weekSel').value;}
function currentWkData(){return weekData[currentWeek()]||{};}

/* ---- UTILS ---- */
const $=id=>document.getElementById(id);
const fmt$=n=>'$'+Math.round(n).toLocaleString();
const fmtD=n=>'$'+n.toFixed(2);
const fmtK=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(0)+'K':String(n);
const fmtR=n=>n.toFixed(2)+'x';
const fmtP=n=>(n*100).toFixed(2)+'%';
const fmtC=n=>'$'+n.toFixed(2);
const rCls=r=>r>=4?'rh':r>=2.5?'rm':'rl';
const sCls=s=>s==='active'?'#43B02A':s.includes('paused')?'#FF9900':'#9e9e9e';

function shortProd(name){
  return name
    .replace(/,\s*Organic French Dessert$/i,'').replace(/,\s*Organic Plant Based Dessert$/i,'')
    .replace(/Pudding with Organic Dairy$/i,'Pudding').replace(/\bwith 8g of Protein$/i,'(Protein)')
    .replace(/^Extra Creamy /i,'EC ').replace(/^Plant-Based /i,'PB ').replace(/,\s*Creamy French Dessert$/i,'').trim();
}

function chg(curr,prev){
  if(!prev||prev===0)return'';const d=(curr-prev)/prev*100;const sign=d>=0?'+':'';
  return`<div class="chg ${d>0?'up':d<0?'dn':'neu'}">${sign}${d.toFixed(1)}% vs prior week</div>`;
}
function yoyStr(curr,prior,label='YoY'){
  if(!prior||prior===0)return'';const d=(curr-prior)/prior*100;const sign=d>=0?'+':'';
  return`<div class="chg ${d>0?'up':d<0?'dn':'neu'}">${sign}${d.toFixed(1)}% ${label}</div>`;
}

function destroyCharts(){Object.values(chartRefs).forEach(c=>{try{c.destroy();}catch(e){}});chartRefs={};}

function totals(rows){
  const spend=rows.reduce((s,r)=>s+r.spend,0),sales=rows.reduce((s,r)=>s+r.sales,0),
    units=rows.reduce((s,r)=>s+r.units,0),impr=rows.reduce((s,r)=>s+r.impr,0),
    clicks=rows.reduce((s,r)=>s+r.clicks,0),ntb=rows.reduce((s,r)=>s+r.ntb_sales,0);
  return{spend,sales,units,impr,clicks,ntb,roas:spend?sales/spend:0,
    ctr:impr?clicks/impr:0,cpc:clicks?spend/clicks:0,ntb_pct:sales?ntb/sales:0};
}
function prevTotals(){
  const weeks=Object.keys(weekData).sort();const cur=currentWeek();const idx=weeks.indexOf(cur);
  if(idx<=0)return null;const prev=weekData[weeks[idx-1]];if(!prev?.campaigns)return null;
  return totals(prev.campaigns.filter(c=>c.spend>0));
}
function weekBadges(){
  const weeks=Object.keys(weekData).sort().reverse();if(weeks.length<2)return'';
  const cur=currentWeek();
  return`<div class="weeks-loaded">${weeks.map(w=>`<span class="wk-badge ${w===cur?'cur':''}" onclick="document.getElementById('weekSel').value='${w}';render()">${w}</span>`).join('')}</div>`;
}

/* ---- TAB ROUTING ---- */
function setTab(tab,el){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  document.getElementById('weekPillWrap').style.display=(tab==='icip')?'none':'';
  render();
}
function render(){
  destroyCharts();
  if(activeTab==='icip'){renderICIP();return;}
  const d=currentWkData();
  if(!d.campaigns&&!d.products){$('content').innerHTML=`<div class="empty-state">No data for this week. Upload an Instacart CSV.</div>`;return;}
  if(activeTab==='summary')renderSummary(d);
  else if(activeTab==='campaigns')renderCampaigns(d);
  else if(activeTab==='products')renderProducts(d);
  else renderTrend();
}

/* ============================================================  CAMPAIGNS TAB  ============================================================ */
function renderCampaigns(d){
  const rows=[...(d.campaigns||[])].filter(c=>c.spend>0);
  rows.sort((a,b)=>{let av=a[sortKey]??0,bv=b[sortKey]??0;if(sortKey==='roas'){av=a.spend?a.sales/a.spend:0;bv=b.spend?b.sales/b.spend:0;}if(sortKey==='ctr'){av=a.impr?a.clicks/a.impr:0;bv=b.impr?b.clicks/b.impr:0;}if(sortKey==='cpc'){av=a.clicks?a.spend/a.clicks:0;bv=b.clicks?b.spend/b.clicks:0;}return sortDir*(bv-av);});
  const H=(label,key,left=false)=>{const a=sortKey===key?(sortDir>0?' ▲':' ▼'):'';return`<th class="${left?'L':''}" onclick="sortCamp('${key}')">${label}${a}</th>`;};
  $('content').innerHTML=`${weekBadges()}<div class="tbl-card"><div class="tbl-hdr"><h3>All Campaigns — Week ending ${currentWeek()}</h3></div><div class="tbl-wrap"><table><thead><tr>${H('Campaign','campaign',true)}<th class="L nosort">Status</th>${H('Spend','spend')}${H('Sales','sales')}${H('ROAS','roas')}${H('Units','units')}${H('Impressions','impr')}${H('Clicks','clicks')}${H('CTR','ctr')}${H('CPC','cpc')}${H('NTB Sales','ntb_sales')}<th class="nosort">NTB%</th></tr></thead><tbody>${rows.map(r=>{const roas=r.spend?r.sales/r.spend:0;return`<tr><td class="L" style="font-weight:600">${r.campaign}</td><td class="L"><span class="status-dot" style="background:${sCls(r.status)}"></span>${r.status}</td><td>${fmtD(r.spend)}</td><td>${fmtD(r.sales)}</td><td><span class="pill ${rCls(roas)}">${fmtR(roas)}</span></td><td>${Math.round(r.units).toLocaleString()}</td><td>${fmtK(r.impr)}</td><td>${fmtK(r.clicks)}</td><td>${r.impr?fmtP(r.clicks/r.impr):'-'}</td><td>${r.clicks?fmtC(r.spend/r.clicks):'-'}</td><td>${r.ntb_sales>0?fmtD(r.ntb_sales):'-'}</td><td>${r.ntb_pct>0?`${(r.ntb_pct*100).toFixed(1)}%<div class="ntb-bar-wrap"><div class="ntb-bar" style="width:${Math.min(r.ntb_pct*100,100)}%"></div></div>`:'-'}</td></tr>`;}).join('')}</tbody></table></div></div>`;

function sortCamp(key){if(sortKey===key)sortDir*=-1;else{sortKey=key;sortDir=-1;}renderCampaigns(currentWkData());}

  setTimeout(()=>{chartRefs.prodChart=new Chart($('cv-prod-chart'),{type:'bar',data:{labels:chartItems.map(([k])=>k.length>30?k.slice(0,28)+'…':k),datasets:[{label:'Attributed Sales',data:chartItems.map(([,v])=>v.sales),backgroundColor:chartItems.map((_,i)=>COLORS[i%COLORS.length]+'80'),borderColor:chartItems.map((_,i)=>COLORS[i%COLORS.length]),borderWidth:2,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:'#f0f0f0'}}}}});},50);

function sortProd(key){if(prodSortKey===key)prodSortDir*=-1;else{prodSortKey=key;prodSortDir=-1;}renderProducts(currentWkData());}

/* ============================================================
   ICIP TAB — Total Platform Sales (from Monthly Tracker)
   ============================================================ */
function renderICIP(){
  const MO_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const allMonths=['01','02','03','04','05','06','07','08','09','10','11','12'];

  // Build yearly series from tracker summary
  const byYr={};
  Object.values(trackerSummary).forEach(v=>{
    const yr=String(v.year);const mm=v.month.slice(5);
    if(!byYr[yr])byYr[yr]={};
    byYr[yr][mm]={sales:v.sales||0,spend:v.sp_spend||0,units:v.units||0,
      attr_units:v.attr_units||0,org_units:v.org_units||0,arp:v.arp||0};
  });

  // YTD 2026 (months available)
  const months2026=Object.keys(byYr['2026']||{}).sort();
  const ytd2026=months2026.reduce((s,mm)=>s+(byYr['2026'][mm]?.sales||0),0);
  const ytd2025comp=months2026.reduce((s,mm)=>s+(byYr['2025']?.[mm]?.sales||0),0);
  const ytdSpend2026=months2026.reduce((s,mm)=>s+(byYr['2026'][mm]?.spend||0),0);
  const latest2026=months2026[months2026.length-1];
  const latestData=byYr['2026']?.[latest2026]||{};
  const attrPct=latestData.units?(latestData.attr_units/latestData.units):0;

  // Product month selector
  const availMonths=[...new Set(trackerProducts.map(p=>p.month))].sort().reverse();
  if(!icipProdMonth||!availMonths.includes(icipProdMonth))icipProdMonth=availMonths[0]||'';
  const selProds=trackerProducts.filter(p=>p.month===icipProdMonth).sort((a,b)=>b.sales-a.sales);
  const grandTot=selProds.reduce((s,p)=>s+p.sales,0);

  // Campaign history months
  const campMonths=Object.keys((trackerCampaigns['Paper cups']||{})).sort();
  const CAMP_NAMES=Object.keys(trackerCampaigns);

  const HP=(label,key,left=false)=>{const a=icipSortKey===key?(icipSortDir>0?' ▲':' ▼'):'';return`<th class="${left?'L':''}" onclick="sortICIP('${key}')">${label}${a}</th>`;};
  const sortedProds=[...selProds].sort((a,b)=>{
    let av=a[icipSortKey]||0,bv=b[icipSortKey]||0;
    if(icipSortKey==='arp'){av=a.units?a.sales/a.units:0;bv=b.units?b.sales/b.units:0;}
    return icipSortDir*(bv-av);
  });

  $('content').innerHTML=`
    <div class="icip-note">ICIP = total Instacart platform sales (organic + ad-attributed). Data from Monthly Instacart Tracker. Upload a new tracker .xlsx to refresh.</div>

    <div class="kpi-strip">
      <div class="kpi">
        <div class="lbl">2026 YTD Sales (Jan–${MO_NAMES[parseInt(latest2026)-1]})</div>
        <div class="val ora">${fmt$(ytd2026)}</div>
        ${yoyStr(ytd2026,ytd2025comp,'vs 2025')}
      </div>
      <div class="kpi">
        <div class="lbl">2025 YTD Jan–${MO_NAMES[parseInt(latest2026)-1]}</div>
        <div class="val">${fmt$(ytd2025comp)}</div>
        <div class="sub">2025 Full Year: ${fmt$(Object.values(byYr['2025']||{}).reduce((s,v)=>s+v.sales,0))}</div>
      </div>
      <div class="kpi">
        <div class="lbl">2026 YTD Ad Spend</div>
        <div class="val blu">${fmt$(ytdSpend2026)}</div>
        <div class="sub">${ytd2026?((ytdSpend2026/ytd2026)*100).toFixed(1)+'% of total sales':''}</div>
      </div>
      <div class="kpi">
        <div class="lbl">${latest2026.replace('-','/')} Total Sales</div>
        <div class="val">${fmt$(latestData.sales||0)}</div>
        ${byYr['2025']?.[latest2026]?yoyStr(latestData.sales,byYr['2025'][latest2026].sales,'vs 2025'):''}
      </div>
      <div class="kpi">
        <div class="lbl">${latest2026.replace('-','/')} ARP</div>
        <div class="val">${latestData.arp?'$'+latestData.arp.toFixed(2):'-'}</div>
        ${byYr['2025']?.[latest2026]?.arp?yoyStr(latestData.arp,byYr['2025'][latest2026].arp,'vs 2025'):''}
      </div>
      <div class="kpi">
        <div class="lbl">${latest2026.replace('-','/')} Attributed %</div>
        <div class="val grn">${attrPct?(attrPct*100).toFixed(1)+'%':'-'}</div>
        <div class="sub">of total units from ads</div>
      </div>
    </div>

    <div class="chart-row single">
      <div class="chart-card">
        <h3>Monthly Total Sales — <span class="yr-2024">2024</span> vs <span class="yr-2025">2025</span> vs <span class="yr-2026">2026</span></h3>
        <div class="chart-wrap xtall"><canvas id="cv-ic-trend"></canvas></div>
      </div>
    </div>

    <div class="chart-row">
      <div class="chart-card">
        <h3>2026: Total Sales vs Ad Spend by Month</h3>
        <div class="chart-wrap"><canvas id="cv-ic-spend"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>2026: Attributed vs Organic Units</h3>
        <div class="chart-wrap"><canvas id="cv-ic-units"></canvas></div>
      </div>
    </div>

    <div class="chart-row">
      ${CAMP_NAMES.map((cn,ci)=>`<div class="chart-card">
        <h3>${cn} — Monthly Attributed Sales (2025)</h3>
        <div class="chart-wrap"><canvas id="cv-camp-${ci}"></canvas></div>
      </div>`).join('')}
    </div>

    <div class="section-sep">Product Detail by Month</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <label style="font-size:12px;font-weight:700;color:var(--g700)">Month:</label>
      <select class="month-sel" onchange="icipProdMonth=this.value;renderICIP()">
        ${availMonths.map(m=>`<option value="${m}" ${m===icipProdMonth?'selected':''}>${m}</option>`).join('')}
      </select>
      <span style="font-size:12px;color:var(--g500)">${sortedProds.length} SKUs — ${fmt$(grandTot)} total</span>
    </div>

    ${sortedProds.length?`
    <div class="chart-row single">
      <div class="chart-card">
        <h3>Total Sales by Product — ${icipProdMonth}</h3>
        <div class="chart-wrap xtall"><canvas id="cv-ic-prod"></canvas></div>
      </div>
    </div>
    <div class="tbl-card">
      <div class="tbl-hdr"><h3>Product Sales — ${icipProdMonth} (All Instacart)</h3></div>
      <div class="tbl-wrap"><table>
        <thead><tr>
          ${HP('Product','sales',true)}
          <th class="L nosort">Size</th>
          ${HP('Total Sales','sales')}${HP('Units','units')}${HP('Deliveries','deliveries')}${HP('ARP','arp')}
          <th class="nosort">Share</th>
        </tr></thead>
        <tbody>${(()=>{
          const PCOLS=['#fd5000','#1b69b3','#43B02A','#FF9900','#9c27b0','#00838f','#e53935','#546e7a','#f57c00','#388e3c','#7b1fa2','#0288d1','#6d4c41','#00acc1','#558b2f'];
          return sortedProds.map((p,i)=>{
            const arpVal=p.units?p.sales/p.units:0;
            const pct=grandTot?p.sales/grandTot:0;
            return`<tr>
              <td class="L" style="font-weight:600">${shortProd(p.product)}</td>
              <td class="L"><span class="size-badge">${p.size}</span></td>
              <td style="font-weight:600">${fmt$(p.sales)}</td>
              <td>${Math.round(p.units).toLocaleString()}</td>
              <td>${Math.round(p.deliveries).toLocaleString()}</td>
              <td>${arpVal?'$'+arpVal.toFixed(2):'-'}</td>
              <td><div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
                <span style="font-size:12px;color:var(--g700);min-width:34px">${(pct*100).toFixed(1)}%</span>
                <div style="width:70px;background:var(--g200);border-radius:3px;height:6px">
                  <div style="width:${Math.min(pct*100,100)}%;height:6px;border-radius:3px;background:${PCOLS[i%PCOLS.length]}"></div>
                </div>
              </div></td>
            </tr>`;
          }).join('');
        })()}</tbody>
      </table></div>
    </div>`:'<div class="notice">No product data for this month.</div>'}`;

  // Draw charts
  const mo26=allMonths.map(mm=>byYr['2026']?.[mm]?.sales||null);
  const mo25=allMonths.map(mm=>byYr['2025']?.[mm]?.sales||null);
  const mo24=allMonths.map(mm=>byYr['2024']?.[mm]?.sales||null);
  const spendMo=months2026.map(mm=>byYr['2026'][mm]?.spend||0);
  const salesMo=months2026.map(mm=>byYr['2026'][mm]?.sales||0);
  const attrMo=months2026.map(mm=>byYr['2026'][mm]?.attr_units||0);
  const orgMo=months2026.map(mm=>byYr['2026'][mm]?.org_units||0);
  const moLabels26=months2026.map(mm=>MO_NAMES[parseInt(mm)-1]);

  setTimeout(()=>{
    // 3-year trend
    chartRefs.icTrend=new Chart($('cv-ic-trend'),{type:'bar',data:{labels:MO_NAMES,datasets:[
      {label:'2024',data:mo24,backgroundColor:'#9e9e9e33',borderColor:'#9e9e9e',borderWidth:2,borderRadius:3},
      {label:'2025',data:mo25,backgroundColor:'#1b69b333',borderColor:'#1b69b3',borderWidth:2,borderRadius:3},
      {label:'2026',data:mo26,backgroundColor:'#fd500055',borderColor:'#fd5000',borderWidth:2,borderRadius:3},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},
      scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+Math.round(v/1000)+'K'},grid:{color:'#f0f0f0'}}}}});

    // Spend vs sales
    chartRefs.icSpend=new Chart($('cv-ic-spend'),{type:'bar',data:{labels:moLabels26,datasets:[
      {label:'Total Sales',data:salesMo,backgroundColor:'#fd500033',borderColor:'#fd5000',borderWidth:2,borderRadius:3,order:2},
      {label:'Ad Spend',data:spendMo,backgroundColor:'#1b69b355',borderColor:'#1b69b3',borderWidth:2,borderRadius:3,order:2},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},
      scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+Math.round(v/1000)+'K'},grid:{color:'#f0f0f0'}}}}});

    // Attr vs organic units
    chartRefs.icUnits=new Chart($('cv-ic-units'),{type:'bar',data:{labels:moLabels26,datasets:[
      {label:'Attributed',data:attrMo,backgroundColor:'#fd500055',borderColor:'#fd5000',borderWidth:2,borderRadius:3},
      {label:'Organic',data:orgMo,backgroundColor:'#43B02A44',borderColor:'#43B02A',borderWidth:2,borderRadius:3},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},
      scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,grid:{color:'#f0f0f0'}}}}});

    // Campaign charts
    CAMP_NAMES.forEach((cn,ci)=>{
      const el=$(`cv-camp-${ci}`);if(!el)return;
      const campData=trackerCampaigns[cn]||{};
      const cMonths=Object.keys(campData).sort();
      const cLabels=cMonths.map(mm=>MO_NAMES[parseInt(mm)-1]);
      chartRefs[`camp${ci}`]=new Chart(el,{type:'bar',data:{labels:cLabels,datasets:[
        {label:'Attributed Sales',data:cMonths.map(mm=>campData[mm]?.sales||0),backgroundColor:ci===0?'#1b69b333':'#fd500033',borderColor:ci===0?'#1b69b3':'#fd5000',borderWidth:2,borderRadius:3},
        {label:'Spend',data:cMonths.map(mm=>campData[mm]?.spend||0),backgroundColor:'#43B02A33',borderColor:'#43B02A',borderWidth:2,borderRadius:3},
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},
        scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+Math.round(v/1000)+'K'},grid:{color:'#f0f0f0'}}}}});
    });

    // Product chart
    if($('cv-ic-prod')){
      const top12=sortedProds.slice(0,12);
      const PCOLS=['#fd5000','#1b69b3','#43B02A','#FF9900','#9c27b0','#00838f','#e53935','#546e7a','#f57c00','#388e3c','#7b1fa2','#0288d1'];
      chartRefs.icProd=new Chart($('cv-ic-prod'),{type:'bar',data:{
        labels:top12.map(p=>{const n=shortProd(p.product)+' '+p.size;return n.length>36?n.slice(0,34)+'…':n;}),
        datasets:[{label:'Total Sales',data:top12.map(p=>p.sales),
          backgroundColor:PCOLS.map(c=>c+'80'),borderColor:PCOLS,borderWidth:2,borderRadius:4}]
      },options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},
        scales:{x:{beginAtZero:true,ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:'#f0f0f0'}}}}});
    }
  },50);
}
function sortICIP(key){if(icipSortKey===key)icipSortDir*=-1;else{icipSortKey=key;icipSortDir=-1;}renderICIP();}

/* ---- INIT ---- */
loadStorage();
populateWeekSelector();
document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===activeTab));
render();
</script>
</body>
</html>
